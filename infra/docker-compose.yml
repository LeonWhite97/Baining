name: pis-in-aoi-v35

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aoi
      POSTGRES_USER: aoi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aoi_demo_change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aoi -d aoi"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      APP_MODE: ${APP_MODE:-demo}
      HANDLER_INTEGRATION_ENABLED: ${HANDLER_INTEGRATION_ENABLED:-false}
      DEMO_AUTO_SEED: "202408"
      DATABASE_URL: postgresql+psycopg://aoi:${POSTGRES_PASSWORD:-aoi_demo_change_me}@postgres:5432/aoi
      AGENT_RAG_URL: http://agent-rag:8013/agent-api/v1
      AOI_IMAGE_ROOT: /aoi-images/normalized_1920x1080
    volumes:
      - ../data/external/pcb_stability_samples:/aoi-images:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  agent-rag:
    build:
      context: ..
      dockerfile: services/agent-rag/Dockerfile
    environment:
      AGENT_RAG_MODE: deterministic
      DATABASE_URL: postgresql+psycopg://aoi:${POSTGRES_PASSWORD:-aoi_demo_change_me}@postgres:5432/aoi
    expose:
      - "8013"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8013/agent-api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  simulator:
    build:
      context: ..
      dockerfile: services/simulator/Dockerfile
    environment:
      API_URL: http://api:8000/api/v1
      SIM_INTERVAL_MS: "2500"
      SIM_SEED: "1000"
      SIM_SCENARIO_MIX: NORMAL,NORMAL,NORMAL,DEFECT,REVIEW,MISSING_3D
      SIM_MODE: continuous
    volumes:
      - ../data/external/pcb_stability_samples:/aoi-images:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  simulator-e2e:
    profiles: ["e2e"]
    build:
      context: ..
      dockerfile: services/simulator/Dockerfile
    environment:
      API_URL: http://api:8000/api/v1
      SIM_MODE: e2e
      SIM_MANIFEST_PATH: /aoi-images/manifest.json
      SIM_REPORT_PATH: /sim-output/pcb-e2e-report.json
      SIM_RUN_ID: ${SIM_RUN_ID:-}
      SIM_LOOPS: ${SIM_LOOPS:-1}
      SIM_CONCURRENCY: ${SIM_CONCURRENCY:-1}
    volumes:
      - ../data/external/pcb_stability_samples:/aoi-images:ro
      - ../tmp:/sim-output
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  postgres_data:
